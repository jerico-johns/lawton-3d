<title>3932 Lawton Walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>

#map{width:176px;height:112px;display:block;cursor:pointer}

#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);font:600 18px var(--display)}
@media(max-width:560px){#map{width:128px;height:82px}#name h1{font-size:16px}#modes button{padding:10px 9px;font-size:12px}}
